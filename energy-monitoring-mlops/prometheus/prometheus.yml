# Prometheus configuration for the energy forecasting stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: energy-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: energy-forecaster

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
