name: CD

# Publishes the inference API image to GHCR:
#   - after CI succeeds on main      -> :latest and :sha-<short>
#   - after CI succeeds on a release -> :<major>.<minor>.<patch>, :<major>.<minor> and :sha-<short>
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: energy-monitoring-mlops
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/energy-forecaster-api

defaults:
  run:
    working-directory: energy-monitoring-mlops

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    # Only ship if CI succeeded on a push to main or a release tag. The event
    # check matters: workflow_run also fires for pull_request CI runs, whose
    # head_branch is the PR's source branch (a fork can name it 'main').
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (
        github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'v')
      )
    steps:
      - name: Resolve commit and tag info
        id: commit
        working-directory: .
        # Passed via env, not interpolated into the script, so a ref name
        # can never be executed as shell.
        env:
          sha: ${{ github.event.workflow_run.head_sha }}
          ref: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # :latest comes only from the explicit main rule, never auto-added on releases
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ steps.commit.outputs.ref == 'main' }}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
            type=semver,pattern={{version}},value=${{ steps.commit.outputs.ref }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.commit.outputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"