name: CD

# Publishes the inference API image to GHCR:
#   - after CI succeeds on main  -> :latest and :sha-<short>
#   - on a v*.*.* release tag     -> :<major>.<minor>.<patch>, :<major>.<minor> and :sha-<short>
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]

concurrency:
  group: cd-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: energy-monitoring-mlops
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/energy-forecaster-api

defaults:
  run:
    working-directory: energy-monitoring-mlops

jobs:
  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    # workflow_run fires on every CI completion; only ship green main builds.
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      # On workflow_run, github.sha is the current tip of main, not the commit
      # CI tested, so check out and tag the tested commit explicitly.
      - name: Resolve commit
        id: commit
        working-directory: .
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=sha-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.commit.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
